<!DOCTYPE html>
<html>
<head>
<title>My Profile Page</title>
<style>
body {
    font-family: Arial;
    background: #eef7ff;
    text-align: center;
}
h2 {
    background: rgb(2, 105, 45);
    color: white;
    padding: 20px;
}
h1{
    color: white
}
h3{
    color: white
}
.card {
    background: black;
    width: 280px;
    margin: 40px auto;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 4px 10px #ccc;
}
.avatar {
    background: red;
    color: white;
    border-radius: 50%;
    width: 90px;
    height: 90px;
    line-height: 90px;
    font-size: 30px;
    margin: auto;
}
.scroll-box {
    height: 120px;
    overflow-y: auto;
    text-align: left;
    padding: 10px;
}
p { color:white; }
</style>
</head>
<body>

<h2>My Profile Page</h2>

<div class="card">
    <div class="avatar">DR</div>
    <h1>Dharmesh Rajpoot</h1>
    <h3>B.Tech CSE Student</h3>

    <div class="scroll-box">
        <p>
            Hi! I love coding and learning HTML, CSS, C and Python.
            I enjoy creating websites and exploring new technologies.
            My goal is to become a skilled web developer.
        </p>
        <p>
            I also enjoy learning new programming languages
            and building creative projects.
        </p>
    </div>
</div>

</body>
</html>
